spring.application.name=citas-api
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/citas_fcv_training}
spring.datasource.username=${DB_USER:citas_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.jwt.secret=${JWT_SECRET}
app.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}
app.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:604800}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.environment=${APP_ENV:production}
app.seed.on-start=${SEED_ON_START:false}
app.seed.weekly-schedules-on-start=${SEED_WEEKLY_SCHEDULES_ON_START:false}
app.seed.default-password=${SEED_DEFAULT_PASSWORD:}
