spring.datasource.url=jdbc:h2:mem:citas;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
app.jwt.secret=test-only-secret-that-is-long-enough-for-hmac-sha256
app.jwt.access-ttl-seconds=900
app.jwt.refresh-ttl-seconds=604800
app.cors.allowed-origins=http://localhost:5173
